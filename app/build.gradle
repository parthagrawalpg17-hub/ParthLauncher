plugins { id 'com.android.application' }

android {
    namespace 'com.parth.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.parth.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
